name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: finsight_ci
          POSTGRES_USER: finsight_ci
          POSTGRES_PASSWORD: synthetic-ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight_ci -d finsight_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_DB: finsight_ci
      POSTGRES_USER: finsight_ci
      POSTGRES_PASSWORD: synthetic-ci-database-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      FRONTEND_ORIGINS: '["http://localhost:5173"]'
      AUTH_JWT_SECRET: synthetic-ci-auth-secret-only-0123456789abcdef
      AUTH_REFRESH_COOKIE_SECURE: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install pinned backend dependencies
        run: python -m pip install --constraint requirements.lock ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff formatting
        run: ruff format --check .
      - name: Backend tests
        run: pytest
      - name: Apply and inspect migrations
        run: |
          alembic upgrade head
          alembic current
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run typecheck
      - name: Production frontend build
        env:
          VITE_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build

  production-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      POSTGRES_PASSWORD: synthetic-compose-database-password
      AUTH_JWT_SECRET: synthetic-compose-auth-secret-0123456789abcdef
      FRONTEND_ORIGINS: '["https://app.example.invalid"]'
      PUBLIC_API_BASE_URL: https://api.example.invalid/api/v1
    steps:
      - uses: actions/checkout@v4
      - name: Validate development and production Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Build production backend
        run: docker build --file backend/Dockerfile.prod --tag finsight-backend:ci backend
      - name: Build production frontend
        run: >-
          docker build --file frontend/Dockerfile.prod
          --build-arg "VITE_API_BASE_URL=${PUBLIC_API_BASE_URL}"
          --tag finsight-frontend:ci frontend
